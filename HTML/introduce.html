<!DOCTYPE html>
<html>
<head>

    <title>自己紹介</title>

    <style>
        body {
            background-color: #f5f4f4;
        }

        .intro {
            background-color: #6d777a;
            color: white;
            text-align: center;
            padding: 50px;
        }

        .content {
            background-color: white;
            color: black;
            padding: 30px;
            margin-top: 20px;
        }
        
        .skills span {
            background-color: #bee2ec;
            padding: 8px 20px;
            border-radius: 10px;
            margin-right: 7px;
            font-size: 15px;
        }

    </style>

</head>

<body>


    <div class="intro">
        <h1>백승록</h1>
        <p> 글로벌시스템융합과 1학년 - 강의실 VLM 프로젝트 팀원</p>
        <img src="cat.jpg" alt="고양이" width="300">
    </div>
        <div class="content">
        <h1>할 일 목록</h1>
    
        <!-- input : 글자를 입력하는 입력창--> <!-- type : 문자 입력용 -->
        <!-- id : JavaScript에서 이 입력창을 찾기 위한 이름 -->
        <!-- placeholoder : 입력창 입력 전에 보이는 안내 문구 -->
        <input type="text" id="todoInput" placeholder="할 일을 입력하세요">
        <botton id="addBtn">추가</botton>

        <!-- JS가 li을 추가 -->
        <ul id="todoList"></ul>
        
        <script>
            function addTodo() {
                let input = document.getElementById("todoInput");
                let text = input.value;

                // 빈 칸이면 추가하지 않음
                if (text.trim() === "") {
                    return;
                }

                // li 생성
                let li = document.createElement("li");

                // 입력한 글을 li에 넣기
                li.textContent = text;

                // ul 안에 li 추가
                document.getElementById("todoList").appendChild(li);

                // 입력창 비우기
                input.value = "";

            }
            
            // 버튼 클릭
            document.getElementById("addBtn").addEventListener("click", function() {
                addTodo();
            });
            
            
            // 엔터 키로도 추가
            document.getElementById("todoInput").addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    addTodo();
                }
            });
        </script>

    </div>

    <div class="content">
        <h1>소개</h1>
        <p> 카메라와 AI로 강의실 상태를 알려주는 시스템을 만들고 있습니다.</p>
    </div>

    <div class="content">
        <h1>프로젝트에서 맡은 일</h1>
        <ul style="font-family: Gulim, sans-serif;">
            <li> 301호 PoE 카메라 4대 설치</li>
            <li> 304호 강의실 사진 수집 확인</li>
        </ul>
    </div>

    <div class="content">
        <h1>공부 중인 것</h1>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Java</span>
        </div>
    </div>

    <div class="content">
        <h1>연락처</h1>
        <a href="https://github.com/sr1011-beep" target="_blank">GitHub 바로가기</a>
    </div>
    

</body>
</html>
