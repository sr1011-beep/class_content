<!DOCTYPE html>
<html>
<head>
    
    <!-- 사이트 타이틀명 -->
    <title>自己紹介</title>

    <!-- style.css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 메인 인트로 문단 -->
    <div class="intro">
        <h1>백승록</h1>
        <p> 글로벌시스템융합과 1학년 - 강의실 VLM 프로젝트 팀원</p>
        <img src="images/cat.jpg" alt="고양이" width="300">

    <!-- 할 일 목록 문단 -->
    </div>
        <div class="content">
        <h1>할 일 목록</h1>
    
        <!-- input : 글자를 입력하는 입력창--> <!-- type : 문자 입력용 -->
        <!-- id : JavaScript에서 이 입력창을 찾기 위한 이름 -->
        <!-- placeholoder : 입력창 입력 전에 보이는 안내 문구 -->
        <input type="text" id="todoInput" placeholder="할 일을 입력하세요">
        <button id="addBtn">추가</button>

        <p>남은 할 일: <span id="count">0</span>개</p>

        <!-- JS가 li을 추가 -->
        <ul id="todoList"></ul>
    </div>

    <!-- 소개 문단 -->
    <div class="content">
        <h1>소개</h1>
        <p> 카메라와 AI로 강의실 상태를 알려주는 시스템을 만들고 있습니다.</p>
    </div>

    <!-- 프로젝트에서 맡은 일 문단 -->
    <div class="content">
        <h1>프로젝트에서 맡은 일</h1>
        <ul style="font-family: Gulim, sans-serif;">
            <li> 301호 PoE 카메라 4대 설치</li>
            <li> 304호 강의실 사진 수집 확인</li>
        </ul>
    </div>
    
    <!-- 공부 목록 문단 -->
    <div class="content">
        <h1>공부 중인 것</h1>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Java</span>
        </div>
    </div>

    <!-- 연락처 문단 -->
    <div class="content">
        <h1>연락처</h1>
        <a href="https://github.com/sr1011-beep" target="_blank">GitHub 바로가기</a>
    </div>

        <button id="themeBtn">다크 모드</button>

    
    <!-- scripts.js -->
    <script src="scripts.js"></script>
</body>
</html>
